name: Validate distributions

on:
  pull_request:
  push:
    branches:
      - main
      - romanskaparen-2.0

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate generated distributions
        run: python3 scripts/validate_distributions.py
