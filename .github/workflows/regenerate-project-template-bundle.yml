name: Regenerate project template bundle

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - .github/workflows/regenerate-project-template-bundle.yml
      - scripts/build_project_template_bundle.py
      - templates/romanprojekt/**

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Regenerate bundle
        run: |
          python scripts/build_project_template_bundle.py
          python scripts/build_project_template_bundle.py --check

      - name: Remove transition addendum
        run: rm -f project-template-storage-v2.md

      - name: Commit regenerated bundle
        run: |
          if git diff --quiet -- project-template-bundle.md project-template-storage-v2.md; then
            echo "Bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-template-bundle.md project-template-storage-v2.md
          git commit -m "Regenerate project template bundle"
          git push origin HEAD:development
