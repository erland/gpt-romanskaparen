name: Sync generated distributions

on:
  push:
    branches:
      - romanskaparen-2.0
    paths:
      - "core/**"
      - "scripts/**"
      - ".github/workflows/sync-distributions.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build generated distributions
        run: python3 scripts/build_distributions.py
      - name: Validate generated distributions
        run: python3 scripts/validate_distributions.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "Generated distributions are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distributions/gpt distributions/project
          git commit -m "Regenerate Romanskaparen distributions"
          git push
