name: Build Romanskaparen distributions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generated project bundle
        run: python3 scripts/build_distributions.py --check-bundle

      - name: Resolve build version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release-taggen måste vara SemVer med v-prefix, exempelvis v1.1.0: $RELEASE_TAG" >&2
              exit 1
            fi
            version="${RELEASE_TAG#v}"
          else
            version="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ -z "$version" ]]; then
            echo "Kunde inte fastställa build-version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bygger Romanskaparen version $version"

      - name: Build distributions
        run: python3 scripts/build_distributions.py --output-dir dist --version "${{ steps.version.outputs.version }}"

      - name: Validate distributions
        shell: bash
        run: python3 scripts/validate_distributions.py dist/*.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: romanskaparen-distributions-v${{ steps.version.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach packages to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
