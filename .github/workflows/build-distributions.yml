name: Release
on:
  release:
    types: [published]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pyyaml jsonschema pytest
      - name: Get version from tag
        id: v
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: python scripts/test_project_integrity_contract.py
      - run: python scripts/test_zip_roundtrip.py
      - run: python scripts/validate_stateful_behavior_contract.py
      - run: python scripts/build_distributions.py --project-root . --version "${{ steps.v.outputs.version }}" --targets project,chat,plugin,claude_project,claude_skills,opencode
      - run: python scripts/validate_distributions.py --project-root .
      - run: python scripts/validate_workflow_parity.py
      - run: python scripts/validate_release_readiness.py --version "${{ steps.v.outputs.version }}"
      - name: Upload
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/SHA256SUMS.txt dist/DELIVERY-MANIFEST.json --clobber
